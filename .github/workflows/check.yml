name: check

permissions:
  contents: read

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13

      - uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7

      - name: install go tools
        run: nix develop --command make tools

      - name: install pi extension deps
        run: nix develop --command npm --prefix .pi ci --no-audit --no-fund

      - name: check
        run: nix develop --command make check

      - name: check-go-quality
        run: nix develop --command make check-go-quality

      - name: check-machines
        run: nix develop --command make check-machines
