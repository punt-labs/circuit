states:
  spec:
    prompt: >
      Write the failing test for the task. Do not implement production code.
      When the targeted test is failing, request the transition event.
    event: writeTest
  red:
    prompt: >
      Implement the smallest code change that makes the failing test pass. Do
      not refactor or broaden scope. When the full check passes, request the
      transition event.
    event: implement
  green:
    prompt: >
      The slice is green. Inspect the changed code for refactoring needs before
      deciding finish or refactor. Look for duplication, poor names, long
      functions, mixed responsibilities, repeated parsing or JSON mapping, and
      missed extraction opportunities. When inspection is complete, request the
      transition event.
    event: inspect
  inspecting:
    prompt: >
      Based on the inspection, request finish if no refactor is needed, or
      request refactor if any smell should be fixed.
  refactoring:
    prompt: >
      Refactor while keeping checks green. Use standard refactorings when they
      apply: Extract Function, Extract Type, Extract Helper, Rename for clarity,
      consolidate duplicate conditionals, and move repeated mapping logic into
      one place. Do not change behavior. When the full check passes, request the
      transition event.
    event: keepGreen
